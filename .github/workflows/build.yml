name: Build & Pack LeviLauncher Mod with ImGui

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK r27d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Download ImGui
        run: |
          git clone --depth 1 --branch v1.91.0 https://github.com/ocornut/imgui.git /tmp/imgui

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_DIR=/tmp/imgui \
            -G Ninja

      - name: Build with Ninja
        run: cmake --build build --config Release -j 2

      - name: Auto-Pack to .levipack
        run: |
          mkdir -p package/config
          
          # Cari file .so utama (bukan preloader)
          find build -name "libclange*.so" -exec cp {} package/ \;
          SO_FILE=$(ls package/*.so | head -n 1 | xargs basename)
          echo "File mod yang ditemukan: $SO_FILE"
          
          # Buat manifest.json
          cat <<EOF > package/manifest.json
          {
            "type": "preload-native",
            "name": "LAN & UI Mod",
            "author": "Developer",
            "version": "1.0.0",
            "entry": "$SO_FILE",
            "minecraft_versions": [],
            "overwrite_files": [],
            "overwrite_folders": []
          }
          EOF
          
          # Buat config dummy
          echo "{}" > package/config/config.json
          echo "{}" > package/config/config.schema.json
          
          # Kemas
          cd package
          zip -r ../LanMod.levipack *

      - name: Upload .levipack Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LanMod-Final
          path: LanMod.levipack
          if-no-files-found: error
