name: Build LeviLauncher Native Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'NDK version (r27c, r26d, r25c, ...)'
        required: false
        default: 'r27c'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repo structure
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Top-level files ==="
          ls -la
          echo "=== Looking for CMakeLists.txt ==="
          find . -maxdepth 3 -name "CMakeLists.txt" -type f
          echo "=== Looking for manifest.json ==="
          find . -maxdepth 3 -name "manifest.json*" -type f

      - name: Setup Android NDK (with retry + fallback)
        id: setup-ndk
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY="${{ github.event.inputs.ndk_version || 'r27c' }}"
          FALLBACKS=("r27c" "r27" "r26d" "r26" "r25c" "r25b")
          NDK_PATH=""

          try_ndk() {
            local ver="$1"
            echo "::group::Trying NDK $ver"
            if "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh" "$ver" > /tmp/ndk.log 2>&1; then
              NDK_PATH=$(cat /tmp/ndk-path.txt 2>/dev/null || true)
              if [ -n "$NDK_PATH" ] && [ -f "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
                echo "✅ NDK $ver installed at: $NDK_PATH"
                echo "::endgroup::"
                return 0
              fi
            fi
            echo "❌ NDK $ver failed. Log tail:"
            tail -20 /tmp/ndk.log || true
            echo "::endgroup::"
            return 1
          }

          # Coba versi utama dulu, kalau gagal coba fallback
          if ! try_ndk "$PRIMARY"; then
            for fb in "${FALLBACKS[@]}"; do
              if [ "$fb" = "$PRIMARY" ]; then continue; fi
              if try_ndk "$fb"; then
                PRIMARY="$fb"
                break
              fi
            done
          fi

          if [ -z "$NDK_PATH" ]; then
            echo "::error::Semua versi NDK gagal diunduh. Cek koneksi runner."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_VERSION_USED=$PRIMARY" >> $GITHUB_ENV
          echo "ndk-path=$NDK_PATH" >> $GITHUB_OUTPUT

      - name: Verify NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME (versi: $NDK_VERSION_USED)"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            || { echo "::error::android.toolchain.cmake tidak ditemukan!"; exit 1; }
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/" || true

      - name: Detect CMake project root
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(dirname "$(find . -maxdepth 3 -name CMakeLists.txt -type f | head -n 1)")
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            ROOT="."
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Configure CMake
        id: cmake-config
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.detect.outputs.root }}"
          cd "$ROOT"
          mkdir -p build
          echo "::group::CMake configure"
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -G Ninja 2>&1 | tee /tmp/cmake.log
          EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::CMake configure gagal. Log terakhir:"
            tail -50 /tmp/cmake.log
            echo "::error::Tip: cek apakah FetchContent preloader berhasil (butuh internet di runner)."
            exit "$EXIT"
          fi

      - name: Build with Ninja
        id: cmake-build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.detect.outputs.root }}"
          cd "$ROOT"
          echo "::group::Ninja build"
          cmake --build build --config Release -j 2 2>&1 | tee /tmp/ninja.log
          EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::Kompilasi gagal. Error terakhir:"
            grep -E "error:|Error|FAILED" /tmp/ninja.log | tail -30 || tail -50 /tmp/ninja.log
            exit "$EXIT"
          fi

      - name: Collect outputs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.detect.outputs.root }}"
          mkdir -p dist
          echo "=== Mencari .so dan .levipack ==="
          find "$ROOT/build" -type f \( -name "*.so" -o -name "*.levipack" \) | tee /tmp/found.txt
          if [ ! -s /tmp/found.txt ]; then
            echo "::error::Tidak ada .so yang dihasilkan. Cek nama target di CMakeLists.txt."
            find "$ROOT/build" -type f -executable | head -20
            exit 1
          fi
          while read -r f; do
            cp "$f" dist/
            echo "Copied: $f"
          done < /tmp/found.txt
          ls -la dist/

      - name: Upload artifact (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-mod-libs
          path: dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/cmake.log
            /tmp/ninja.log
            /tmp/ndk.log
          if-no-files-found: ignore
          retention-days: 7
