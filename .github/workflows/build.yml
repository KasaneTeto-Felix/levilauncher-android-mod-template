name: Build Modul Levi NMDK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔥 EKSTRAK OTOMATIS NMdk.ZIP
      - name: Extract NMDK Zip
        run: |
          echo "Mengekstrak nmdk.zip..."
          unzip -q nmdk.zip -d temp_extract
          
          # Cari folder nmdk di dalam hasil ekstrak dan pindahkan ke root
          NMDK_FOLDER=$(find temp_extract -maxdepth 2 -type d -name "nmdk" | head -n 1)
          
          if [ -n "$NMDK_FOLDER" ]; then
            echo "Ketemu folder NMDK di: $NMDK_FOLDER"
            cp -r "$NMDK_FOLDER" .
          else
            echo "Tidak ketemu folder bernama 'nmdk', membuat folder manual..."
            mkdir -p nmdk
            cp -r temp_extract/* nmdk/ 2>/dev/null || true
          fi
          
          echo "=== Cek isi folder nmdk ==="
          ls -la nmdk/

      - name: Setup Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure Xmake
        run: |
          xmake f -p android -a arm64-v8a --ndk=${{ steps.setup-ndk.outputs.ndk-path }} -m release -y

      - name: Build Modul
        run: |
          xmake build -y

      - name: Package .levipack
        run: |
          mkdir -p dist/modul_levi
          # Cari file .so yang dihasilkan
          cp $(find build -name "libmodul_levi.so" | head -n 1) dist/modul_levi/
          cp manifest.json dist/modul_levi/
          
          # Buat config dummy
          mkdir -p dist/modul_levi/config
          echo "{}" > dist/modul_levi/config/config.json
          
          # Zip jadi .levipack
          cd dist
          zip -r ModulLevi.levipack modul_levi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModulLevi-Final
          path: dist/ModulLevi.levipack
